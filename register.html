<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear Cuenta - Alke Wallet</title>
  <!-- Google Fonts Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom Fintech Styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

  <!-- Navbar Simple -->
  <header>
    <nav class="navbar navbar-light bg-white border-bottom py-3">
      <div class="container justify-content-between">
        <a class="navbar-brand navbar-brand-custom" href="index.html">
          <span class="brand-icon-badge"><i class="bi bi-wallet2"></i></span>
          <span>Alke Wallet</span>
        </a>
        <a href="login.html" class="btn btn-sm btn-outline-secondary rounded-pill">
          <i class="bi bi-box-arrow-in-right me-1"></i>Ya tengo cuenta
        </a>
      </div>
    </nav>
  </header>

  <!-- Register Main Section -->
  <main class="auth-wrapper flex-grow-1">
    <div class="auth-card p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="brand-icon-badge mx-auto mb-3" style="width: 52px; height: 52px; font-size: 1.5rem; background: linear-gradient(135deg, #10b981 0%, #059669 100%);">
          <i class="bi bi-person-check-fill"></i>
        </div>
        <h2 class="fw-bold mb-1">Crea tu Alke Wallet</h2>
        <p class="text-muted small">Únete a la nueva era digital en gestión financiera</p>
      </div>

      <!-- Alerta dinámica -->
      <div id="registerAlert" class="alert d-none small py-2 px-3 mb-3" role="alert"></div>

      <!-- Formulario de Registro -->
      <form id="registerForm" novalidate>
        <div class="mb-3">
          <label for="regName" class="form-label fw-semibold small text-secondary">Nombre Completo</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control border-start-0 ps-0" id="regName" placeholder="Tu nombre y apellido" required>
          </div>
        </div>

        <div class="mb-3">
          <label for="regEmail" class="form-label fw-semibold small text-secondary">Correo Electrónico</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control border-start-0 ps-0" id="regEmail" placeholder="correo@ejemplo.com" required>
          </div>
        </div>

        <div class="mb-3">
          <label for="regPassword" class="form-label fw-semibold small text-secondary">Contraseña</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control border-start-0 ps-0" id="regPassword" placeholder="Mínimo 6 caracteres" minlength="6" required>
          </div>
        </div>

        <div class="mb-4 form-check">
          <input type="checkbox" class="form-check-input" id="termsCheck" required checked>
          <label class="form-check-label small text-secondary" for="termsCheck">Acepto los términos y condiciones de Alke Wallet</label>
        </div>

        <button type="submit" class="btn btn-success w-100 py-2 rounded-3 fw-bold shadow-sm">
          <i class="bi bi-check2-circle me-1"></i>Registrar mi cuenta
        </button>
      </form>

      <div class="text-center mt-4 pt-3 border-top">
        <span class="text-muted small">¿Ya tienes una cuenta activa?</span>
        <a href="login.html" class="fw-semibold text-decoration-none small ms-1 text-primary">Inicia Sesión aquí</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="py-3 bg-white border-top text-center text-muted small">
    <div class="container">
      Alke Wallet © 2026 • Evaluación Módulo #2 Front-End
    </div>
  </footer>

  <!-- Scripts: jQuery, Bootstrap Bundle, State & App Controller -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/wallet-state.js"></script>
  <script>
    $(document).ready(function() {
      $('#registerForm').on('submit', function(e) {
        e.preventDefault();
        const name = $('#regName').val().trim();
        const email = $('#regEmail').val().trim();
        const pass = $('#regPassword').val().trim();
        const $alert = $('#registerAlert');

        if (!name || !email || !pass) {
          $alert.removeClass('d-none alert-success').addClass('alert-danger')
            .html('<i class="bi bi-exclamation-triangle-fill me-2"></i>Por favor completa todos los campos requeridos.').fadeIn();
          return;
        }

        if (pass.length < 6) {
          $alert.removeClass('d-none alert-success').addClass('alert-danger')
            .html('<i class="bi bi-shield-lock-fill me-2"></i>La contraseña debe tener al menos 6 caracteres.').fadeIn();
          return;
        }

        $alert.removeClass('d-none alert-danger').addClass('alert-success')
          .html('<i class="bi bi-check-circle-fill me-2"></i>¡Cuenta creada con éxito! Redirigiendo a tu billetera...').fadeIn();

        setTimeout(function() {
          AlkeState.login(email, pass);
          window.location.href = 'menu.html';
        }, 1000);
      });
    });
  </script>
</body>
</html>
